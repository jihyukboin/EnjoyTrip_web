<section class="notice-banner" aria-label="공지사항" data-notice-banner data-notice-key="{{key}}">
    <svg class="notice-banner__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="공지">
      <path d="M11 6a13 13 0 0 0 8.4-2.8A1 1 0 0 1 21 4v12a1 1 0 0 1-1.6.8A13 13 0 0 0 11 14H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" />
      <path d="M6 14a12 12 0 0 0 2.4 7.2 2 2 0 0 0 3.2-2.4A8 8 0 0 1 10 14" />
      <path d="M8 6v8" />
    </svg>
    <a class="notice-banner__title" href="/post/detail?notice={{id}}">{{title}}</a>
    <button class="notice-banner__close" type="button" aria-label="공지 닫기" data-notice-close>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="m18 6-12 12M6 6l12 12" />
      </svg>
    </button>
  </section>
