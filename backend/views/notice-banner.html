<section class="notice-banner" aria-label="공지사항" data-notice-banner data-notice-key="{{key}}">
    <p class="notice-banner__text">
      <span class="notice-banner__badge">공지</span>
      <strong class="notice-banner__title">{{title}}</strong>
      <span class="notice-banner__content">{{content}}</span>
    </p>
    <button class="notice-banner__close" type="button" aria-label="공지 닫기" data-notice-close>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="m18 6-12 12M6 6l12 12" />
      </svg>
    </button>
  </section>
