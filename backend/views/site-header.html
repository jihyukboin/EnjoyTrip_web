<header class="site-header">
  <div class="site-header__bar">
    <a class="site-header__brand" href="/" aria-label="EnjoyTrip 홈으로 이동">
      <img src="/assets/logo.svg" alt="" width="18" height="18">
      <span>EnjoyTrip</span>
    </a>
    <nav class="site-header__navigation" aria-label="메뉴 바">
      <a href="/" data-nav-link="/">홈</a>
      <a href="/post" data-nav-link="/post">게시판</a>
      <!-- admin-link -->
    </nav>
    <!-- guest-account-start -->
    <a class="site-header__login site-header__desktop-login" href="{{account-href}}">{{account-label}}</a>
    <!-- guest-account-end -->
    <!-- account-menu -->
    <button class="site-header__toggle" type="button" hidden
      aria-label="모바일 메뉴 열기" aria-expanded="false" aria-controls="site-mobile-menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path class="site-header__menu-icon" d="M4 6h16M4 12h16M4 18h16" />
        <path class="site-header__close-icon" d="m18 6-12 12M6 6l12 12" />
      </svg>
    </button>
  </div>
  <nav id="site-mobile-menu" class="site-header__mobile-menu" aria-label="모바일 메뉴" hidden>
    <!-- guest-account-start -->
    <div class="site-header__mobile-account">
      <a class="site-header__login" href="{{account-href}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="5" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
        <span data-account-label>{{account-label}}</span>
      </a>
    </div>
    <!-- guest-account-end -->
    <a href="/" data-nav-link="/">홈</a>
    <a href="/post" data-nav-link="/post">게시판</a>
    <!-- admin-link -->
  </nav>
  <!-- notice-banner -->
</header>
