<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판 | EnjoyTrip</title>
    <!-- document-head -->
    <link rel="stylesheet" href="/css/components/board-hero.css">
    <link rel="stylesheet" href="/css/components/post-list.css">
  </head>
  <body>
    <!-- site-header -->
    <main>
      <section class="board-hero" aria-labelledby="board-hero-title">
        <canvas class="board-hero__canvas" aria-hidden="true"></canvas>
        <div class="board-hero__content">
          <h1 id="board-hero-title" class="board-hero__title">
            <span>EnjoyTrip 게시판</span>
            <span>어디로 떠나볼까요?</span>
          </h1>
          <div class="board-hero__actions">
            <a class="board-hero__action" href="/post/write">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                <path d="m15 5 4 4" />
              </svg>
              글쓰기
            </a>
          </div>
        </div>
      </section>
      <section class="post-list" aria-labelledby="post-list-title" data-post-list>
        <h2 id="post-list-title" class="post-list__title">게시글</h2>
        <p class="post-list__status" role="status">게시글을 불러오는 중입니다.</p>
        <ol class="post-list__items"></ol>
        <nav class="pagination" aria-label="게시글 페이지" hidden></nav>
      </section>
    </main>
  </body>
</html>
