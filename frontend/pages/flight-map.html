<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비행 | EnjoyTrip</title>
    <!-- document-head -->
    <link rel="stylesheet" href="/css/components/flight-map.css">
    <!-- 모듈 스크립트보다 먼저 실행되도록 defer 없이 불러오고, 지도 모듈은 kakao.maps.load로 늦게 읽는다 -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey={{kakao-map-key}}&amp;autoload=false"></script>
  </head>
  <body>
    <div class="flight-map" role="region" aria-label="지도" data-flight-map></div>
    <p class="flight-map__status" role="status"></p>
  </body>
</html>
