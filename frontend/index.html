<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnjoyTrip</title>
    <!-- document-head -->
    <link rel="stylesheet" href="/css/components/travel-hero.css">
  </head>
  <body>
    <!-- site-header -->
    <main>
      <section class="travel-hero" aria-labelledby="travel-hero-title">
        <canvas class="travel-hero__canvas" aria-hidden="true"></canvas>
        <div class="travel-hero__content">
          <h1 id="travel-hero-title" class="travel-hero__title">
            <span>EnjoyTrip</span>
            <span>여행을 떠나보세요</span>
          </h1>
          <div class="travel-hero__actions">
            <a class="travel-hero__action travel-hero__action--primary" href="/flight">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" />
              </svg>
              직접 비행하기
            </a>
            <a class="travel-hero__action travel-hero__action--secondary" href="/post">여행 신청하기</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
